aid: helcim
url: https://raw.githubusercontent.com/api-evangelist/helcim/refs/heads/main/apis.yml
name: Helcim
kind: company
description: >-
  Helcim is a Calgary, Canada based payment processor and merchant services
  provider serving small and medium-sized businesses across Canada and the
  United States with interchange-plus pricing and no monthly fees. Beyond its
  merchant dashboard, Smart Terminal hardware, and online store, Helcim ships a
  genuine developer surface: the versioned Helcim API (v2) for taking card and
  ACH payments, managing customers, cards, bank accounts and pre-authorized
  debits (PADs), issuing invoices, settling card and ACH batches, and driving
  in-person Card Terminal devices, alongside HelcimPay.js hosted checkout and
  connected-account webhooks. Authentication is a permissioned API access token
  passed in an api-token header, and the public developer portal publishes a
  downloadable OpenAPI 3.0 definition. In Canada's small, concentrated payments
  market, Helcim is one of the API-native SMB money-movement fintechs building
  above the incumbent acquiring and Interac rails.
